<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="logo.png">
<title>معرض لوحتي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700&display=swap">
<style>
  /* Layout: a wall of paintings hung edge to edge in uneven columns, like a kids' studio pin-board; RTL */
  :root {
    --paper: #fbf1f4;      /* blush studio wall */
    --frame: #ffffff;      /* card / mat */
    --ink: #2a1f2b;        /* plum-black text */
    --soft: #75636f;       /* secondary text */
    --rose: #c2416f;       /* brand accent */
    --line: rgba(42, 31, 43, .10);
    --veil: rgba(24, 16, 22, .94);
    --font-display: "Reem Kufi", "Tajawal", "Segoe UI", Tahoma, sans-serif;
    --font-body: "Tajawal", "Segoe UI", Tahoma, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1c1519; --frame: #2a2026; --ink: #f6e9ef; --soft: #b8a3ae;
      --rose: #f07fa6; --line: rgba(246, 233, 239, .12); --veil: rgba(8, 5, 7, .95);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #1c1519; --frame: #2a2026; --ink: #f6e9ef; --soft: #b8a3ae;
    --rose: #f07fa6; --line: rgba(246, 233, 239, .12); --veil: rgba(8, 5, 7, .95);
    color-scheme: dark;
  }

  [hidden] { display: none !important; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.6;
  }
  .wrap {
    max-width: 1240px;
    margin: 0 auto;
    padding-block: 28px 56px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 16px 24px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 28px;
  }
  .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .brand img {
    width: 72px; height: 72px; object-fit: cover;
    border-radius: 50%;
    box-shadow: 0 4px 14px rgba(194, 65, 111, .25);
  }
  h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(1.8rem, 4.5vw, 2.6rem);
    line-height: 1.15;
    margin: 0;
    text-wrap: balance;
  }
  h1 span { color: var(--rose); }
  .sub { margin: 4px 0 0; color: var(--soft); font-size: .98rem; }
  .meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .count {
    font-family: var(--font-display);
    color: var(--soft);
    font-size: .95rem;
    font-variant-numeric: tabular-nums;
  }
  .ig {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 16px; border-radius: 999px;
    background: var(--rose); color: var(--frame);
    text-decoration: none; font-weight: 700; font-size: .95rem;
  }
  .ig:hover { filter: brightness(1.08); }
  .ig:focus-visible, .art:focus-visible, .lb button:focus-visible {
    outline: 3px solid var(--rose); outline-offset: 3px;
  }
  .ig svg { width: 18px; height: 18px; }

  .wall { max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
  .art {
    display: block; width: 100%;
    margin: 0;
    padding: 10px;
    background: var(--frame);
    border: 1px solid var(--line);
    border-radius: 4px;
    box-shadow: 0 6px 18px rgba(42, 31, 43, .07);
    cursor: zoom-in;
    font: inherit; color: inherit; text-align: inherit;
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .art:nth-child(3n+1) { transform: rotate(-.6deg); }
  .art:nth-child(3n+2) { transform: rotate(.5deg); }
  .art:hover { transform: translateY(-4px) rotate(0); box-shadow: 0 14px 28px rgba(42, 31, 43, .12); }
  .art img { display: block; width: 100%; height: auto; border-radius: 2px; background: var(--line); }
  .art .cap {
    display: block;
    padding: 10px 4px 4px;
    font-size: 1rem; color: var(--soft); text-align: center;
  }
  .art .cap b { color: var(--ink); font-weight: 700; }

  .empty {
    text-align: center; padding: 64px 16px;
    border: 2px dashed var(--line); border-radius: 8px; color: var(--soft);
  }
  .empty h2 { font-family: var(--font-display); color: var(--ink); margin: 0 0 6px; font-size: 1.5rem; }

  footer { margin-top: 36px; text-align: center; color: var(--soft); font-size: .9rem; }

  .lb {
    position: fixed; inset: 0; z-index: 50;
    background: var(--veil);
    display: grid; grid-template-rows: auto 1fr auto;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) max(10px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 16px) max(10px, env(safe-area-inset-left, 0px));
    color: #fff;
  }
  .lb-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .lb-pos { font-variant-numeric: tabular-nums; opacity: .75; font-size: .95rem; }
  .lb-stage { position: relative; display: flex; align-items: center; justify-content: center; min-height: 0; }
  .lb-stage img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 2px; }
  .lb-name { text-align: center; font-family: var(--font-display); font-size: 1.25rem; min-height: 1.6em; padding-top: 10px; }
  .lb button {
    background: rgba(255,255,255,.12); color: #fff; border: 0;
    width: 46px; height: 46px; border-radius: 50%;
    font-size: 1.4rem; line-height: 1; cursor: pointer;
    display: grid; place-items: center;
  }
  .lb button:hover { background: rgba(255,255,255,.22); }
  .lb .nav { position: absolute; top: 50%; translate: 0 -50%; }
  .lb .prev { right: 4px; }
  .lb .next { left: 4px; }

  @media (max-width: 520px) {
    .wall { gap: 20px; }
    .art { padding: 8px; }
    .art .cap { font-size: .95rem; padding: 8px 2px 2px; }
    .lb .nav { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .art, .art:nth-child(n) { transition: none; transform: none; }
  }

  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; }
  img { max-width: 100%; }
</style>
</head>
<body>


<div class="wrap" dir="rtl" lang="ar">
  <header>
    <div class="brand">
      <img src="logo.png" alt="شعار لوحتي">
      <div>
        <h1>معرض <span>لوحتي</span></h1>
        <p class="sub">إبداعات طلاب دورات الرسم</p>
      </div>
    </div>
    <div class="meta">
      <span class="count" id="count">8 لوحة</span>
      <a class="ig" href="https://www.instagram.com/law7atiii" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
        تابعونا على إنستغرام
      </a>
    </div>
  </header>

  <main id="wall" class="wall" aria-label="لوحات الطلاب"></main>

  <div id="empty" class="empty" hidden>
    <h2>اللوحات في الطريق 🎨</h2>
    <p>نعمل على تعليق لوحات الطلاب هنا قريباً.</p>
  </div>

  <footer>كل لوحة هنا رسمها طالب أو طالبة في دورات لوحتي 💗</footer>
</div>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="عرض اللوحة">
  <div class="lb-top">
    <span class="lb-pos" id="lbPos"></span>
    <button type="button" id="lbClose" aria-label="إغلاق">✕</button>
  </div>
  <div class="lb-stage">
    <button type="button" class="nav prev" id="lbPrev" aria-label="اللوحة السابقة">›</button>
    <img id="lbImg" alt="">
    <button type="button" class="nav next" id="lbNext" aria-label="اللوحة التالية">‹</button>
  </div>
  <div class="lb-name" id="lbName"></div>
</div>

<script>
  const ITEMS = [{"src": "photos/001.png", "name": "ديمة حوش"}, {"src": "photos/002.jpeg", "name": "نور مراد"}, {"src": "photos/003.jpeg", "name": "موسى حوراني"}, {"src": "photos/004.png", "name": "موسى حوراني"}, {"src": "photos/005.jpeg", "name": "ميليا مراد"}, {"src": "photos/006.png", "name": "ميليا مراد"}, {"src": "photos/007.png", "name": "امال زيدان"}, {"src": "photos/008.jpeg", "name": "ملك حوراني"}];
  const wall = document.getElementById('wall');
  const lb = document.getElementById('lb');
  const lbImg = document.getElementById('lbImg');
  const lbName = document.getElementById('lbName');
  const lbPos = document.getElementById('lbPos');
  let current = 0, lastFocus = null;

  const nums = n => n.toLocaleString('ar-EG');
  document.getElementById('count').textContent =
    ITEMS.length === 1 ? 'لوحة واحدة' : ITEMS.length === 2 ? 'لوحتان'
      : nums(ITEMS.length) + (ITEMS.length <= 10 ? ' لوحات' : ' لوحة');

  if (!ITEMS.length) document.getElementById('empty').hidden = false;

  ITEMS.forEach((it, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'art';
    const img = document.createElement('img');
    img.src = it.src;
    img.loading = i < 6 ? 'eager' : 'lazy';
    img.alt = it.name ? 'لوحة بريشة ' + it.name : 'لوحة من أعمال الطلاب';
    b.append(img);
    if (it.name) {
      const cap = document.createElement('span');
      cap.className = 'cap';
      const n = document.createElement('b');
      n.textContent = it.name;
      cap.append('بريشة ', n);
      b.append(cap);
    }
    b.addEventListener('click', () => open(i));
    wall.append(b);
  });

  function show(i) {
    current = (i + ITEMS.length) % ITEMS.length;
    const it = ITEMS[current];
    lbImg.src = it.src;
    lbImg.alt = it.name ? 'لوحة بريشة ' + it.name : 'لوحة من أعمال الطلاب';
    lbName.textContent = it.name ? 'بريشة ' + it.name : '';
    lbPos.textContent = nums(current + 1) + ' / ' + nums(ITEMS.length);
  }
  function open(i) { lastFocus = document.activeElement; show(i); lb.hidden = false; document.getElementById('lbClose').focus(); }
  function close() { lb.hidden = true; if (lastFocus) lastFocus.focus(); }

  document.getElementById('lbClose').addEventListener('click', close);
  document.getElementById('lbPrev').addEventListener('click', () => show(current - 1));
  document.getElementById('lbNext').addEventListener('click', () => show(current + 1));
  lb.addEventListener('click', e => { if (e.target === lb || e.target.classList.contains('lb-stage')) close(); });
  document.addEventListener('keydown', e => {
    if (lb.hidden) return;
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowLeft') show(current + 1);   /* RTL: left = next */
    else if (e.key === 'ArrowRight') show(current - 1);
  });
  let x0 = null;
  lb.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
  lb.addEventListener('touchend', e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 50) show(current + (dx > 0 ? 1 : -1));
  });
</script>

</body>
</html>
